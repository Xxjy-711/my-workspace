<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植物文本效果</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
  <canvas id="canvas" width="800" height="200"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let particles = [];
let time = 0;
let mouseX = -9999, mouseY = -9999;

const offCanvas = document.createElement('canvas');
const offCtx = offCanvas.getContext('2d');

// 原版多彩花朵色板
const BLOOM_COLORS = [
  [255, 80, 120],   // 粉红
  [255, 160, 50],   // 橙黄
  [255, 210, 60],   // 金黄
  [255, 100, 60],   // 橙红
  [220, 70, 90],    // 玫红
  [190, 100, 200],  // 粉紫
  [255, 140, 100],  // 浅橙
];
const LEAF_COLOR = [50, 160, 70];

function generateParticles(text) {
  // 固定参数，直接匹配原版效果
  const density = 6;        // 加密，让细笔画有足够花朵
  const bloomSize = 5;      // 花朵稍小，避免重叠
  const spread = 3;         // 小传播，花朵集中在文字上
  const leafMix = 0.06;     // 少量叶子

  offCanvas.width = canvas.width;
  offCanvas.height = canvas.height;
  offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
  offCtx.fillStyle = '#fff';
  offCtx.font = 'normal 130px Georgia, "Times New Roman", serif';
  offCtx.textAlign = 'center';
  offCtx.textBaseline = 'middle';
  offCtx.fillText(text, offCanvas.width / 2, offCanvas.height / 2);

  const imageData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
  const data = imageData.data;

  particles = [];

  for (let y = 0; y < offCanvas.height; y += density) {
    for (let x = 0; x < offCanvas.width; x += density) {
      const idx = (y * offCanvas.width + x) * 4;
      if (data[idx + 3] > 60) {
        const isLeaf = Math.random() < leafMix;
        // 传播：从文字像素向外散落
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * spread * (0.3 + Math.random() * 0.7);
        // 大小均匀，轻微差异
        const sizeMult = 0.75 + Math.random() * 0.45;

        const color = isLeaf ? LEAF_COLOR : BLOOM_COLORS[Math.floor(Math.random() * BLOOM_COLORS.length)];

        particles.push({
          baseX: x + Math.cos(angle) * dist,
          baseY: y + Math.sin(angle) * dist,
          x: x, y: y,
          size: (isLeaf ? bloomSize * 0.7 : bloomSize) * sizeMult,
          rotation: Math.random() * Math.PI * 2,
          phase: Math.random() * Math.PI * 2,
          type: isLeaf ? 'leaf' : 'bloom',
          petalCount: 5,
          r: color[0], g: color[1], b: color[2],
          hoverScale: 1,
          hoverOpacity: 1,
          velScale: 0,
          velOpacity: 0
        });
      }
    }
  }
}

function drawBloom(p) {
  const s = p.size * p.hoverScale * (1 + Math.sin(time * 1.5 + p.phase) * 0.05);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rotation + Math.sin(time * 0.4 + p.phase) * 0.08);
  ctx.globalAlpha = Math.min(1, p.hoverOpacity);

  // 5瓣简单小花
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2;
    ctx.save();
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.ellipse(0, -s * 0.45, s * 0.3, s * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.fill();
    ctx.restore();
  }
  // 花心
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.18, 0, Math.PI * 2);
  ctx.fillStyle = `rgb(${Math.min(255,p.r+40)},${Math.min(255,p.g+40)},${Math.min(255,p.b+20)})`;
  ctx.fill();

  ctx.restore();
}

function drawLeaf(p) {
  const s = p.size * p.hoverScale * (1 + Math.sin(time * 1.2 + p.phase) * 0.07);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rotation + Math.sin(time * 0.35 + p.phase) * 0.1);
  ctx.globalAlpha = Math.min(1, p.hoverOpacity * 0.9);

  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.2, s * 0.55, 0, 0, Math.PI * 2);
  ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
  ctx.fill();

  ctx.restore();
}

// 弹簧物理悬停
const SPRING_K = 0.05;
const SPRING_D = 0.8;

function updateHover() {
  const hoverRadius = 90;
  for (const p of particles) {
    const dx = p.x - mouseX;
    const dy = p.y - mouseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const target = dist < hoverRadius ? 1 + (1 - dist / hoverRadius) * 1.3 : 1;
    const force = SPRING_K * (target - p.hoverScale) - SPRING_D * p.velScale;
    p.velScale += force;
    p.velScale *= 0.88;
    p.hoverScale += p.velScale;
    p.hoverOpacity = 1;
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  time += 0.016;
  updateHover();

  for (const p of particles) {
    p.x = p.baseX + Math.sin(time * 0.25 + p.phase) * 1;
    p.y = p.baseY + Math.cos(time * 0.2 + p.phase) * 1;
  }

  for (const p of particles) {
    if (p.type === 'leaf') drawLeaf(p);
  }
  for (const p of particles) {
    if (p.type === 'bloom') drawBloom(p);
  }

  requestAnimationFrame(render);
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
  mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
});
canvas.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999; });

generateParticles('Flower');
render();
</script>
</body>
</html>
